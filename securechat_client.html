<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SecureChat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0d0f14; --surface:#151820; --panel:#1c2030; --border:#252a3a;
    --accent:#4fffb0; --accent2:#00cfff; --danger:#ff4f6d; --warn:#ffcb47;
    --text:#e8eaf2; --muted:#6b7494; --own-msg:#1a3a2a; --other-msg:#1c2030;
    --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  
  /* TOAST */
  #toast{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
  .toast-item{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    color:var(--text);font-size:13px;padding:10px 16px;border-radius:8px;animation:slideIn .25s ease;max-width:280px;}
  .toast-item.error{border-left-color:var(--danger);}
  .toast-item.warn{border-left-color:var(--warn);}
  @keyframes slideIn{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  /* AUTH */
  #auth-screen{flex:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 60% 40%,#0e2a1e 0%,#0d0f14 65%);}
  .auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:44px 48px;width:400px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
  .auth-logo{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);
    letter-spacing:2px;text-align:center;margin-bottom:6px;}
  .auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:32px;}
  .auth-tabs{display:flex;margin-bottom:28px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .auth-tab{flex:1;padding:9px;background:transparent;border:none;color:var(--muted);
    font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;}
  .auth-tab.active{background:var(--accent);color:#0d0f14;font-weight:700;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase;}
  .inp{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:10px 14px;margin-bottom:16px;outline:none;transition:border-color .2s;}
  .inp:focus{border-color:var(--accent);}
  .btn-primary{width:100%;padding:12px;background:var(--accent);color:#0d0f14;font-family:var(--sans);
    font-size:15px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:opacity .2s;margin-top:4px;}
  .btn-primary:hover{opacity:.85;}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
  #auth-error{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;}

  /* MAIN */
  #app{flex:1;display:flex;overflow:hidden;}
  #app.hidden,#auth-screen.hidden{display:none;}

  /* SIDEBAR */
  #sidebar{width:240px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .sidebar-header{padding:18px 16px 12px;border-bottom:1px solid var(--border);}
  .sidebar-logo{font-family:var(--mono);font-size:15px;color:var(--accent);font-weight:700;letter-spacing:1.5px;}
  .sidebar-user{font-size:12px;color:var(--muted);margin-top:4px;}
  .sidebar-user span{color:var(--text);font-weight:600;}
  .online-header{padding:12px 16px 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;}
  #user-list{flex:1;overflow-y:auto;padding-bottom:8px;}
  .user-entry{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;
    border-left:3px solid transparent;transition:background .15s,border-color .15s;}
  .user-entry:hover{background:var(--panel);}
  .user-entry.active{background:var(--panel);border-left-color:var(--accent);}
  .user-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 6px var(--accent);}
  .user-dot.offline{background:var(--muted);box-shadow:none;}
  .user-name-label{font-size:14px;font-weight:500;}
  .user-unread{margin-left:auto;background:var(--accent);color:#0d0f14;border-radius:10px;
    padding:1px 7px;font-size:11px;font-weight:700;display:none;}
  .user-unread.show{display:inline;}
  .sidebar-bottom{border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:8px;}
  .btn-icon{flex:1;padding:8px 0;background:var(--panel);border:1px solid var(--border);
    color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;font-family:var(--sans);}
  .btn-icon:hover{border-color:var(--accent);color:var(--accent);}
  .btn-danger:hover{border-color:var(--danger);color:var(--danger);}

  /* CHAT */
  /*Fixing the chat bar running donw, out of screeen MAR 15*/
  #chat-panel{
  flex:1;
  display:flex;
  flex-direction:column;

  position:relative;
  min-width:0;
  min-height:0;  
  }  
  #no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;}
  #no-chat .nc-icon{font-size:48px;opacity:.3;}
  #no-chat.hidden,#active-chat.hidden{display:none;}
  #active-chat{flex:1;display:flex;flex-direction:column; min-height:0;}

  .chat-topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;
    border-bottom:1px solid var(--border);background:var(--surface);}
  .chat-topbar-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .chat-topbar-name{font-weight:600;font-size:16px;}
  .chat-topbar-status{color:var(--muted);font-size:12px;}
  .chat-topbar-enc{margin-left:auto;font-size:11px;color:var(--accent);
    background:rgba(79,255,176,.08);border:1px solid rgba(79,255,176,.2);
    border-radius:6px;padding:3px 10px;font-family:var(--mono);letter-spacing:.5px;}

  #messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px; 
    min-height:0;/*Add the min-height*/
    overscroll-behavior:contain; /*prevent bounching if overscroll*/
  }

  .msg-wrap{display:flex;flex-direction:column;max-width:68%;animation:msgIn .18s ease;}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .msg-wrap.own{align-self:flex-end;align-items:flex-end;}
  .msg-wrap.other{align-self:flex-start;align-items:flex-start;}
  .msg-wrap.system{align-self:center;align-items:center;max-width:90%;}
  .msg-meta{font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center;}
  .msg-meta .sender{font-weight:600;color:var(--text);}
  .msg-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
  .own .msg-bubble{background:var(--own-msg);border:1px solid rgba(79,255,176,.2);border-bottom-right-radius:3px;}
  .other .msg-bubble{background:var(--other-msg);border:1px solid var(--border);border-bottom-left-radius:3px;}
  .system .msg-bubble{background:transparent;color:var(--muted);border:none;font-size:12px;font-style:italic;text-align:center;padding:4px 0;}

  .file-bubble{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;}
  .file-icon{font-size:22px;}
  .file-info{display:flex;flex-direction:column;gap:1px;}
  .file-name{font-weight:600;font-size:13px;}
  .file-size{color:var(--muted);font-size:11px;}
  .file-dl{margin-left:auto;background:var(--accent);color:#0d0f14;border:none;
    border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);}

  /* INPUT */
  .input-area{border-top:1px solid var(--border);background:var(--surface);padding:14px 16px; flex-shrink:0;/*block input area heigh*/}
  .formatting-bar{display:flex;gap:4px;margin-bottom:8px;}
  .fmt-btn{background:transparent;border:1px solid transparent;border-radius:5px;color:var(--muted);
    cursor:pointer;padding:3px 8px;font-size:13px;transition:all .15s;font-family:var(--sans);}
  .fmt-btn:hover{border-color:var(--border);color:var(--text);background:var(--panel);}
  .input-row{display:flex;gap:8px;align-items:flex-end;}
  #msg-input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:11px 14px;
    resize:none;outline:none;max-height:120px;transition:border-color .2s;line-height:1.5; overflow-y:auto;} /*Fix missing chat bar MAR15*/

  #msg-input:focus{border-color:var(--accent);}
  .input-actions{display:flex;gap:6px;}
  .send-btn{background:var(--accent);color:#0d0f14;border:none;border-radius:10px;
    padding:11px 18px;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:opacity .2s;}
  .send-btn:hover{opacity:.85;}
  #rate-warn{color:var(--warn);font-size:12px;text-align:right;padding:2px 4px 0;min-height:16px;}
  .icon-btn{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--muted);cursor:pointer;padding:10px 13px;font-size:16px;transition:all .2s;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* EMOJI */
  #emoji-panel{position:absolute;bottom:80px;right:20px;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:12px;
    display:flex;flex-wrap:wrap;gap:4px;width:260px;z-index:100;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  #emoji-panel.hidden{display:none;}
  .emoji-btn{background:none;border:none;font-size:20px;cursor:pointer;
    border-radius:6px;padding:4px 6px;transition:background .15s;line-height:1;}
  .emoji-btn:hover{background:var(--border);}

  /* TYPING */
  .typing-wrap{padding:0 20px 4px;height:18px;}
  .typing-indicator{font-size:12px;color:var(--muted);font-style:italic;}

  /* CONN STATUS */
  #conn-status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--border);border-radius:20px;
    padding:5px 14px;font-size:12px;font-family:var(--mono);
    display:flex;align-items:center;gap:7px;z-index:200;transition:opacity .3s;}
  #conn-status.ok{opacity:0;pointer-events:none;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite;}
  .conn-dot.ok{background:var(--accent);animation:none;}
  .conn-dot.err{background:var(--danger);animation:none;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<div id="toast"></div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">🔒 SECURECHAT</div>
    <div class="auth-sub">End-to-end encrypted · SecureTech Solutions</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="auth-error"></div>
    <label>Server Address (wss://)</label>
    <!--<input class="inp" id="server-addr" value="wss://localhost:8765" style="font-family:var(--mono);font-size:12px"/>-->
    <!--Hide real Server IP before upload to Git, MAR 13-->
    <!--<input class="inp" id="server-addr" value="wss://xxx.yyy.zzz.aaa:7777" style="font-family:var(--mono);font-size:12px"/> REMOVE APR 30 MOR for the real URL-->

    <input class="inp" id="server-addr" value="wss://securechat-fp59.onrender.com" readonly style="font-family:var(--mono);font-size:12px"/> <!--New and official URL-->
    <!--add Readonly parameter to make sure client cannot alter the URL anymore, APR 30 MOR-->
    <label>Username</label>
    <input class="inp" id="auth-user" placeholder="Enter username" autocomplete="username"/>
    <label>Password</label>
    <input class="inp" id="auth-pass" type="password" placeholder="Min 8 chars, upper, lower, digit"
           onkeydown="if(event.key==='Enter')doAuth()"/>
    <button class="btn-primary" id="auth-btn" onclick="doAuth()">Connect & Login</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🔒 SECURECHAT</div>
      <div class="sidebar-user">Logged in as <span id="me-label">—</span></div>
    </div>
    <div class="online-header">Online Users</div>
    <div id="user-list"></div>
    <div class="sidebar-bottom">
      <button class="btn-icon" onclick="openFilePicker()">📎 File</button>
      <button class="btn-icon btn-danger" onclick="doLogout()">⏻ Exit</button>
    </div>
  </div>

  <div id="chat-panel">
    <div id="no-chat">
      <div class="nc-icon">💬</div>
      <div style="color:var(--muted);font-size:15px">Select a user to start chatting</div>
    </div>

    <div id="active-chat" class="hidden">
      <div class="chat-topbar">
        <div class="chat-topbar-dot" id="topbar-dot"></div>
        <div>
          <div class="chat-topbar-name" id="topbar-name">—</div>
          <div class="chat-topbar-status" id="topbar-status">Online</div>
        </div>
        <div class="chat-topbar-enc">🔐 TLS Encrypted</div>
      </div>
      <div id="messages"></div>
      <div class="typing-wrap"><div class="typing-indicator" id="typing-ind"></div></div>
      <div class="input-area">
        <div class="formatting-bar">
          <button class="fmt-btn" onclick="wrapFmt('**','**')"><b>B</b></button>
          <button class="fmt-btn" onclick="wrapFmt('_','_')"><i>I</i></button>
          <button class="fmt-btn" onclick="wrapFmt('`','`')">&#60;/&#62;</button>
          <button class="fmt-btn" onclick="insertLink()">🔗</button>
        </div>
        <div class="input-row">
          <textarea id="msg-input" rows="1" placeholder="Type a message…"
            oninput="autoResize(this);onTyping()"
            onkeydown="msgKeydown(event)"></textarea>
          <div class="input-actions">
            <button class="icon-btn" onclick="toggleEmoji()">😊</button>
            <button class="icon-btn" onclick="openFilePicker()">📎</button>
            <button class="send-btn" onclick="sendMessage()">Send ➤</button>
          </div>
        </div>
        <div id="rate-warn"></div>
      </div>
    </div>

    <div id="emoji-panel" class="hidden"></div>
  </div>
</div>

<div id="conn-status">
  <div class="conn-dot" id="conn-dot"></div>
  <span id="conn-label">Disconnected</span>
</div>

<input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)"/>

<script>
  const debug_flag = false; //Debug flag, ensure not let user know about error.

//add in MAR 13 to handle encryption
let RSA_Key_Pair = null;        // users RSA keys
let chat_AES_Keys = {};         // AES key of each chat user
let my_Username = null;
let pendingMessages = {}; //prevent mess loss when AES key not ready, MAY 1 EVE
let trustedFingerprints = {}; //for fingerint veridication, MAY 1 EVE

// ── STATE ────────
let ws=null, myUsername='', currentChat=null, authMode='login';
let chatHistories={}, onlineUsers=new Set(), unreadCounts={};
let msgTimestamps=[], reconnTimer=null, heartbeatTimer=null;
let typingTimeout=null, pendingAuth=null;
const RATE_LIMIT=5, RATE_WINDOW=8000;
let sessionToken = null; //session token MATCH with backend

const EMOJIS=['😀','😂','😆','🥰','😎','🤔','😢', '🧐', //add the :monocle: lol
  '❤️','💔','🔥','💯','👍','👎',
  '🎉','✅','❌','❓','⚠️','🔒', '🚀','⭐','💡','🌐','💻',
  '🐐','👋','💪','🙌','😴','🤯','😤','🙄','😇','🤗']; //add and remove some emojis, lol

// ── BUILD EMOJI PANEL ─
(function(){
  const p=document.getElementById('emoji-panel');
  EMOJIS.forEach(e=>{
    const b=document.createElement('button'); b.className='emoji-btn'; b.textContent=e;
    b.onclick=()=>{ insertAtCursor(e); p.classList.add('hidden'); };
    p.appendChild(b);
  });
})();

document.addEventListener('click',e=>{
  if(!e.target.closest('#emoji-panel')&&!e.target.closest('.icon-btn'))
    document.getElementById('emoji-panel').classList.add('hidden');
});

// ── AUTH UI ───────────────────────────────────────────────────────────────────
function switchTab(mode){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',i===(mode==='login'?0:1)));
  document.getElementById('auth-btn').textContent=mode==='login'?'Connect & Login':'Connect & Register';
  document.getElementById('auth-error').textContent='';
}

async function doAuth(){
  const addr=document.getElementById('server-addr').value.trim();
  const user=document.getElementById('auth-user').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const errEl=document.getElementById('auth-error');
  errEl.textContent='';
  if(!addr||!user||!pass){errEl.textContent='All fields required.';return;}
  myUsername=user.toLowerCase();
  const btn=document.getElementById('auth-btn');
  btn.disabled=true; btn.textContent='Connecting…';
  try{
    await connectWS(addr,user,pass,authMode);
  }catch(e){
    errEl.textContent=e.message||'Connection failed.';
    btn.disabled=false;
    btn.textContent=authMode==='login'?'Connect & Login':'Connect & Register';
  }
}

// ── WEBSOCKET ─────────────
function connectWS(serverURL, username, passwd, connection_Type) {
    return new Promise((resolve, reject) => {
        if (ws) {
            try { ws.close(); } catch (error) {}
        }

        setConn('connecting');

        try { 
            ws = new WebSocket(serverURL); 
        } catch (event) { 
            reject(new Error('Invalid server address.'));
            return; 
        }

        pendingAuth = { resolve, reject };

        ws.onopen = async () => {
            console.log('CONNECTED to server!');
            
            // Send auth/register immediately
            ws.send(JSON.stringify({
              type: connection_Type === 'login' ? 'auth' : 'register',
              username: username,
              password: passwd
            }));
        };

        ws.onmessage = event => {
          console.log("raw mess:", event.data);
          try {
            handleMsg(event.data);
          } catch (err) {
            console.error("handleMsg crashed!", err); //TRYING TO FIND THE REASON CHAT FAIL, MAY 5 mor
          };
        };

        ws.onclose = (event) => {
            setConn('disconnected');
            if(debug_flag ==true)
              console.log("DISCONNECTED", event); //Add for debugging apr 30
            clearInterval(heartbeatTimer);
            if (!authDone && pendingAuth) {
              pendingAuth.reject(new Error('Server closed during auth.'));
              pendingAuth = null;
              return;
            } else {
                showToast('Disconnected. Reconnecting in 2s…', 'warn');
                scheduleReconnect();
            }
        };

        ws.onerror = (event) => {
            if (pendingAuth) {
                if(debug_flag ==true)
                  console.log("WS ERROR", event); //Add for debugging apr 30
                //pendingAuth.reject(new Error('Cannot reach server. Check address and make sure server is running.'));
                pendingAuth.reject(new Error('Cannot reach server.')); //from APR 28, there is no hand-typed IP, so make the announcement shorter
                pendingAuth = null;
            }
        };
    });
}

function scheduleReconnect(){
  clearTimeout(reconnTimer);
  reconnTimer=setTimeout(()=>{
    const pass=document.getElementById('auth-pass').value;
    const addr=document.getElementById('server-addr').value.trim();
    connectWS(addr,myUsername,pass,'login').catch(()=>{});
  },2000);
}

function startHeartbeat(){
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(()=>{ 
    if(ws&&ws.readyState===1) 
    ws.send(JSON.stringify({type:'ping'})); }, 25000); //25 SECs
}*/

function refreshOnlineUsers(){
    if(ws && ws.readyState === 1){
        ws.send(JSON.stringify({type:'get_users'}));
    }
}
//setInterval(refreshOnlineUsers, 16000);//removeD, MAY 1

function startHeartbeat(){
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => { 
    if(ws && ws.readyState===1){
        //ws.send(JSON.stringify({type:'ping'})); //remove the ping, MAY 2 MOR
        ws.send(JSON.stringify({type:'get_users'})); //refresh online users
    }
  }, 25000);
}

// ── MESSAGE HANDLER ─────────
//new fucntion to control the most messgsage stored per chat 
const MAX_HISTORY = 160; //max 160 mess per chat
function addToHistory(chatUser, mess) {
  if (!chatHistories[chatUser]) chatHistories[chatUser] = [];
  
  chatHistories[chatUser].push(mess);

  if (chatHistories[chatUser].length > MAX_HISTORY) {
    chatHistories[chatUser].shift();
  }
}

let authDone = false; //add to fix red line pop-up issues [close connections], MAY 4 EVE
async function handleMsg(raw){ //async to use "await" [mar13]
  let d;
  
  try{d=JSON.parse(raw);}catch(e){return;}

  if(d.type==='auth_success'||d.type==='register_success'){
    authDone = true;
    setConn('connected');
    startHeartbeat();
    //sessionToken = d.token;
    sessionToken = d.token || d.session_token || d.sessionToken;
    //console.log("token store:", sessionToken);
    console.log("Auth debig process:", d);
    console.log("Session token:", sessionToken);

    if (!sessionToken) {
        console.warn("Token is missing :(", d);
    }

    if(!RSA_Key_Pair){
        await create_Key_Pair();
    }

    let pubKey = await export_Pub_Key();

    ws.send(JSON.stringify({
        type:"post_public_key",
        key:pubKey
    }));

    if(pendingAuth){pendingAuth.resolve();pendingAuth=null;}

  if(d.type==='auth_fail'||d.type==='error'){
    const msg=d.message||'Authentication failed.';

  }

  }
  if(d.type==='user_left'){
    onlineUsers.delete(d.username); renderUserList();
    pushSystem(d.username,`${d.username} left the chat`); return;
  }
  if(d.type === 'server_error'){ //added MAY 1 MOR
  showToast(d.message || 'Server error', 'error');
  return;
  }
  if(d.type==='system'){
    // broadcast system message — figure out which chat
    Object.keys(chatHistories).forEach(u=>pushSystem(u,d.content));
    if(currentChat) appendSystemMsg(d.content);
    return;
  }
  if(d.type === 'message'){
    const senderId = d.from;
    //decrypt before storing and display
    let decrypted_Text = d.content;
    let decryption_Key = chat_AES_Keys[senderId];

  
    //removed this para to get got try catch
    /*if(decryption_Key){
        decrypted_Text = await decrypt_AES(decryption_Key, decrypted_Text);

    if (decryption_Key) {

        decrypted_Text = "!!!Message cannot be decrypted :(!!!";

    }

    if(!chatHistories[senderId]) chatHistories[senderId] = [];
    //chatHistories[from].push({kind:'text', from, content:d.content, time:d.time||nowHM()});
    //chatHistories[senderId].push({ using new helper function, MAY 1 EVE
    addToHistory(senderId, {kind:'text', from:senderId, content:decrypted_Text, time:d.time||nowHM()});

    if(currentChat === senderId){ 
      //appendMsg(from, d.content, false, d.time||nowHM()); 
      /* MOV to above MAR 14
      let content = d.content;

      let key = chat_AES_Keys[from];

      if(key){
          content = await decrypt_AES(key,content);
      }
      */
      appendMsg(senderId, decrypted_Text, false, d.time||nowHM());
      scrollBottom(); 
      }
    else{ 
      unreadCounts[senderId]=(unreadCounts[senderId]||0)+1; 
      renderUserList(); 
      showToast(`New message from ${senderId}: ...`); }
    return;
  }
  /*
  if(d.type==='file'){
    const from=d.from;
    if(!chatHistories[from]) chatHistories[from]=[];
    chatHistories[from].push({kind:'file',from,filename:d.filename,size:d.size,data:d.data,time:d.time||nowHM()});
    if(currentChat===from){ appendFileReceived(from,d.filename,d.size,d.data,d.time||nowHM()); scrollBottom(); }
    else{ unreadCounts[from]=(unreadCounts[from]||0)+1; renderUserList(); showToast(`📎 File from ${from}: ${d.filename}`); }
    return;
  }*/

  if(d.type === 'file'){
      const senderId = d.from;
      let decrypted_Data = d.data;
      let session_Key = chat_AES_Keys[senderId];

      if(session_Key){
          decrypted_Data = await decrypt_AES(session_Key, decrypted_Data);
      }

      if(!chatHistories[senderId]) chatHistories[senderId] = [];
      //chatHistories[senderId].push({
       addToHistory(senderId, {kind: 'file', from: senderId, filename: d.filename, size: d.size, data: decrypted_Data, time: d.time || nowHM()});
      if(currentChat === senderId){
          appendFileReceived(senderId, d.filename, d.size, decrypted_Data, d.time||nowHM());
          scrollBottom();
      }
      else{
          unreadCounts[senderId] = (unreadCounts[senderId]|| 0)+1;
          renderUserList();
          showToast(`File from ${senderId}: ${d.filename}`);
      }

      return;
  }

  if(d.type === 'typing'){
    if(currentChat===d.from) showTyping(d.from); 
    return;
  }
  if(d.type === 'rate_limit'){
    const mess = d.message || 'Reached rate limit. Now, wait -_-'; //tiny fix the structure of the mess
    document.getElementById('rate-warn').textContent = mess;
    setTimeout(()=>{document.getElementById('rate-warn').textContent='';},3000);

  if(d.type === "key_response"){
    const fingerprint = d.fingerprint
      if (!fingerprint) {
      console.warn("Sever's fingerprint IS MISSING :(");

    }
    const encrypted_Key = Uint8Array.from(atob(d.key),c=>c.charCodeAt(0));
    //security check, MAY 1 EVE
    ;
    if (trustedFingerprints[d.user] && trustedFingerprints[d.user] !== fingerprint) {
    showToast("Key fingerprint mismatch!", "error");
    return;
    }

    trustedFingerprints[d.user] = fingerprint;

    const raw_Key = await crypto.subtle.decrypt( {name:"RSA-OAEP"}, RSA_Key_Pair.privateKey, encrypted_Key);

    chat_AES_Keys[d.user] = await crypto.subtle.importKey(
        "raw", raw_Key,
        {name:"AES-GCM"},
        false,
        ["encrypt","decrypt"]
    );

    //flush queued messages
    if (pendingMessages[d.user] && pendingMessages[d.user].length > 0) {
        for (const mess of pendingMessages[d.user]) {

}

// ── USER LIST ─────────────────────────────────────────────────────────────────
function renderUserList(){
  const ul=document.getElementById('user-list');
  ul.innerHTML='';
  // online users first, then users we have history with (offline)
  const seen=new Set();
  const all=[];
  onlineUsers.forEach(u=>{seen.add(u);all.push({u,online:true});});
  Object.keys(chatHistories).forEach(u=>{if(!seen.has(u)&&u!==myUsername){all.push({u,online:false});}});
  if(!all.length){
    ul.innerHTML='<div style="padding:12px 16px;color:var(--muted);font-size:13px">No other users online</div>';
    return;
  }
  all.forEach(({u,online})=>{
    const div=document.createElement('div');
    div.className='user-entry'+(currentChat===u?' active':'');
    div.onclick=()=>openChat(u);
    div.innerHTML=`<div class="user-dot${online?'':' offline'}"></div>
      <div class="user-name-label">${esc(u)}</div>
      <div class="user-unread${(unreadCounts[u]>0)?' show':''}">${unreadCounts[u]||''}</div>`;
    ul.appendChild(div);
  });
}

function openChat(user){
  currentChat = user;

  //prevention method MAY 1
  if (!ws || ws.readyState !== 1) {
      showToast("Not connected to server", "error");
      return;
  }

  ws.send(JSON.stringify({
    type: "request_key",
    target_user: user
  }));

  //LOAD MESS INTO FRONT END
  ws.send(JSON.stringify({
  type: "get_history",
  with: user
  }));

  //in waiting time for the key, temporary block the send button to prevent the error, MAY 1 EVE
  document.querySelector('.send-btn').disabled = true;

  unreadCounts[user] = 0;
  renderUserList();

  document.getElementById('no-chat').classList.add('hidden');
  document.getElementById('active-chat').classList.remove('hidden');
  document.getElementById('topbar-name').textContent=user;
  const online=onlineUsers.has(user);
  const dot=document.getElementById('topbar-dot');
  dot.style.background=online?'var(--accent)':'var(--muted)';
  dot.style.boxShadow=online?'0 0 8px var(--accent)':'none';
  document.getElementById('topbar-status').textContent=online?'Online':'Offline';
  const msgs=document.getElementById('messages'); msgs.innerHTML='';
  (chatHistories[user]||[]).forEach(m=>{
    if(m.kind==='text') appendMsg(m.from,m.content,m.from===myUsername,m.time);
    else if(m.kind==='file'){
      if(m.from===myUsername) appendFileSent(m.filename,m.size,m.data,m.time);
      else appendFileReceived(m.from,m.filename,m.size,m.data,m.time);
    } else if(m.kind==='system') appendSystemMsg(m.content);
  });
  scrollBottom();
  document.getElementById('msg-input').focus();
}

//message updated [MAR 13]
async function sendMessage() {
    if (!currentChat) return;

    const chat_Input = document.getElementById('msg-input');
    let plain_Text = chat_Input.value.trim();
    if (!plain_Text)
      return; //if there is nothing to be send

    //check rate limiting requirements
    const now2 = Date.now();
    //have to use msgTimestamp to matched predefined name
    msgTimestamps = msgTimestamps.filter(t => now2 - t < RATE_WINDOW);
    if (msgTimestamps.length >= RATE_LIMIT) {
        document.getElementById('rate-warn').textContent = 'RATE LIMIT: slow down!';
        setTimeout(() => { document.getElementById('rate-warn').textContent = ''; }, 2500);
        return;
    }
    msgTimestamps.push(now2);

    //mess encryption process
    let encrypted_Text = plain_Text;
    const key = chat_AES_Keys[currentChat];
    if (!key) {
      showToast("Secure channel chat is NOT ready..:(.. So the message is queued.", "warn");

      if (!pendingMessages[currentChat]) pendingMessages[currentChat] = [];
      pendingMessages[currentChat].push(plain_Text);
      return;
    }

    try {
      encrypted_Text = await encrypt_AES(key, plain_Text);
    } catch (err) {
      showToast("Encryption error!", "error");
      return;
    }

    //sending to sever
    if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
            type: 'message', token: sessionToken, to: currentChat, content: encrypted_Text}));
    } 
    else {
        showToast('Not connected to server!!', 'warn');
        return;
    }

    //update chat history
    const timestamp = nowHM();
    if (!chatHistories[currentChat]) chatHistories[currentChat] = [];
    chatHistories[currentChat].push({
        kind:'text', from: myUsername, content: plain_Text,
        //content: encrypted_Text, //note that I always store encrypted [INCORRECT]
        time: timestamp});

    //rendering mess
    appendMsg(myUsername, plain_Text, true, timestamp); //render decrypted OR plaintext
    scrollBottom();

    //clear input
    chat_Input.value= '';
    autoResize(chat_Input);
}

function msgKeydown(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

  if(!chatHistories[forUser]) chatHistories[forUser]=[];

// ── TEXT FORMATTING ────────────────────────────────────────────────────────────
function fmtText(t){
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); 
  t = t.replace(/((https?:\/\/|www\.)[^\s]+)/g, url => {
    if (!url.startsWith("http")) url = "https://" + url;
    return `<a href="${url}" target="_blank" style="color:var(--accent)">${url}</a>`; //I love the link to be GREEN, lol
});
  //t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); //bold
  t=t.replace(/_(.+?)_/g,'<em>$1</em>'); //italic
  t=t.replace(/`(.+?)`/g,'<code style="background:var(--border);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px">$1</code>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent2)">$1</a>');
  return t;
}
function wrapFmt(pre,suf){
  const inp=document.getElementById('msg-input');
  const s=inp.selectionStart,e=inp.selectionEnd;
  const sel=inp.value.slice(s,e)||'text';
  inp.value=inp.value.slice(0,s)+pre+sel+suf+inp.value.slice(e);
  inp.focus(); inp.selectionStart=s+pre.length; inp.selectionEnd=s+pre.length+sel.length;
}

function fileIcon(n){
  const x=(n.split('.').pop()||'').toLowerCase();
  if(['jpg','jpeg','png','gif','webp','svg'].includes(x)) return '🖼️';
  if(x==='pdf') return '📄';
  if(['zip','rar','7z','tar','gz'].includes(x)) return '🗜️';
  if(['mp4','mov','avi','mkv'].includes(x)) return '🎬';
  if(['mp3','wav','ogg','flac'].includes(x)) return '🎵';
  if(['doc','docx'].includes(x)) return '📝';
  if(['xls','xlsx','csv'].includes(x)) return '📊';
  return '📁';
}

async function export_Pub_Key() {
    const p_key = await crypto.subtle.exportKey("spki", RSA_Key_Pair.publicKey);
    const base_64 = btoa(String.fromCharCode(...new Uint8Array(p_key)));

    const pem_formated =
        "-----BEGIN PUBLIC KEY-----\n" +
        base_64.match(/.{1,64}/g).join("\n") +
        "\n-----END PUBLIC KEY-----";
    return pem_formated;
}

async function encrypt_AES(crypt_Key, mess) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded_Text = new TextEncoder().encode(mess);
    const encrypted = await crypto.subtle.encrypt({name:"AES-GCM", iv}, crypt_Key, encoded_Text);
    
    const data_package = new Uint8Array(iv.length + encrypted.byteLength);
    data_package.set(iv);
    data_package.set(new Uint8Array(encrypted), iv.length);

    return btoa(String.fromCharCode(...data_package)); // always base 64 for transport
}

async function decrypt_AES(crypt_Key, base64) {
    const data_package = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const iv = data_package.slice(0, 12);
    const encrypted = data_package.slice(12);
    const decoded_Text = await crypto.subtle.decrypt({name:"AES-GCM", iv}, crypt_Key, encrypted);
    return new TextDecoder().decode(decoded_Text);
}
